params:
    description: "I’m a doctoral researcher exploring how humans and robots can better understand each other. My work spans Human-Robot Interaction (HRI), Human-Computer Interaction (HCI), and Tutoring Robots. I investigate how tutoring robots can better adapt to human skills, behaviour and emotional states to build smarter, more responsive learning tools that genuinely help people."
    author: Ranul Vithanage
    googleAnalyticsID:
