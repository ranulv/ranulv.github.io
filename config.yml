params:
    description: "I am a passionate doctoral researcher with a focus on Human-Robot Interaction (HRI), Child-Robot Interaction (CRI), and Socially Assistive Robotics. My work centers on enhancing the synergy between humans and robots, aiming to create systems that can intuitively understand and respond to human needs and emotions."
    author: Ranul Vithanage
    googleAnalyticsID:
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: true
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Ranul Vithanage
